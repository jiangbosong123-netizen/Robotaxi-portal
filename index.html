  document.getElementById('cardGrid').innerHTML = '<div class="loading"><div class="spinner"></div><div>鍔犺浇鏁版嵁涓?..</div></div>';

  try {

    const r = await fetch('robotaxi_data.json');

    DATA = await r.json();

    init();

  } catch(e) {

    document.getElementById('cardGrid').innerHTML = '<div class="loading">鍔犺浇澶辫触锛岃纭 robotaxi_data.json 瀛樺湪</div>';

  }

}



function init() {

  document.getElementById('updateBadge').textContent =

    `鏇存柊浜?${DATA.updated_at}`;

  

  document.getElementById('statBar').innerHTML = [

    [DATA.total, '鎬绘柊闂?], [DATA.week_count, '鏈懆鏂板'],

    [DATA.companies.length, '瑕嗙洊鍏徃'],

    [DATA.news.filter(n=>n.date>=((d=>{d.setDate(d.getDate()-7);return d.toISOString().slice(0,10)})(new Date()))).length, '鏈懆鏇存柊']

  ].map(s => `<div class="stat-card"><span class="num">${s[0]}</span><span class="label">${s[1]}</span></div>`).join('');



  function companyLabel(c) {

    const labels = DATA.company_labels || {};

    return labels[c] || c;

  }

  document.getElementById('companyFilter').innerHTML =

    '<button class="filter-btn active" onclick="setF(\'company\',\'all\',this)">鍏ㄩ儴</button>' +

    DATA.companies.map(function(c) {

      var label = companyLabel(c);

      var info = (DATA.company_info || {})[c] || '';

      return '<button class="filter-btn" onclick="setF(\'company\',\''+c+'\',this)" title="' + label + ' 鈥?' + info + '">' + label + '</button>';

    }).join('');



  document.getElementById('sourceFilter').innerHTML =

    '<button class="filter-btn active" onclick="setF(\'source\',\'all\',this)">鍏ㄩ儴</button>' +

    DATA.sources.map(s => `<button class="filter-btn" onclick="setF('source','${s}',this)">${s}</button>`).join('');



  document.getElementById('typeFilter').innerHTML =

    '<button class="filter-btn active" onclick="setF(\'type\',\'all\',this)">鍏ㄩ儴</button>' +

    DATA.types.map(t => `<button class="filter-btn" onclick="setF('type','${t}',this)">${t}</button>`).join('');



  renderWeekly();

  initWeekSelector();

  render();



  // 楂樹寒鍗＄墖寮瑰嚭浜や簰锛堥€愰」缁戝畾锛岀畝鍗曠洿鎺ワ級

  (function() {

    var popup = document.getElementById('floatingPopup');

    if (!popup) {

      popup = document.createElement('div');

      popup.id = 'floatingPopup';

      popup.className = 'hl-popup';

      popup.style.display = 'none';

      document.body.appendChild(popup);

    }

    

    var hlContainer = document.getElementById('weeklyHL');

    

    function showFor(item) {

      cancelHide();

      var src = item.querySelector('.hl-popup');

      if (!src) { popup.style.display = 'none'; return; }

      popup.innerHTML = src.innerHTML;

      popup.style.display = 'block';

      var rect = item.getBoundingClientRect();

      var left = rect.right + 12;

      if (left + 380 > window.innerWidth) left = Math.max(8, rect.left - 380 - 12);

      popup.style.left = left + 'px';

      popup.style.top = Math.max(8, rect.top - 10) + 'px';

    }

    var hideTimer = null;

    function hidePopup() {

      if (hideTimer) clearTimeout(hideTimer);

      hideTimer = setTimeout(function() { popup.style.display = 'none'; }, 450);

    }

    function cancelHide() {

      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }

    }

    

    // 浜嬩欢濮旀墭锛氱粦鍦ㄥ鍣ㄤ笂锛孌OM鏇挎崲鍚庝緷鐒舵湁鏁?

    hlContainer.addEventListener('mouseover', function(e) {

      var item = e.target.closest('.hl-item');

      if (!item) { hidePopup(); return; }

      showFor(item);

    });

    hlContainer.addEventListener('mouseout', function(e) {

      var related = e.relatedTarget;

      if (related && related.closest && (related.closest('.hl-item') || related.closest('#floatingPopup'))) return;

      hidePopup();

    });

    

    // popup鏈韩锛氱Щ鍏ュ彇娑堥殣钘忥紝绉诲嚭寤舵椂闅愯棌

    popup.addEventListener('mouseenter', function() { cancelHide(); });

    popup.addEventListener('mouseleave', function() { hidePopup(); });

    

    // popup鍐呯偣鍑绘柊闂昏烦杞?

    popup.addEventListener('click', function(e) {

      var pi = e.target.closest('.popup-item');

      if (pi) {

        var url = pi.getAttribute('data-url');

        if (url) window.open(url, '_blank');

      }

    });

    

    // 鐐瑰嚮楂樹寒鍗＄瓫閫?

    document.getElementById('weeklyHL').addEventListener('click', function(e) {

      var item = e.target.closest('.hl-item');

      if (!item) return;

      var comp = item.getAttribute('data-company');

      if (!comp) return;

      popup.style.display = 'none';

      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }

      selectCompany(comp);

    });

  })();

}



function setF(type, val, btn) {

  if (type === 'company') activeCompany = val;

  else if (type === 'type') activeType = val;

  else activeSource = val;

  document.querySelectorAll(`#${type}Filter .filter-btn`).forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  render();

}



function selectCompany(comp) {

  if (activeCompany === comp) return;

  // 澶勭悊鍏徃鍚嶆槧灏勶細濡傛灉comp涓嶆槸涓€涓暟鎹簱閲岀殑鍏徃鍚嶏紝灏濊瘯鍙嶅悜鏄犲皠

  if (DATA.company_labels) {

    var found = false;

    for (var k in DATA.company_labels) {

      if (k === comp) { found = true; break; }

    }

    if (!found) {

      for (var k in DATA.company_labels) {

        if (DATA.company_labels[k] === comp) { comp = k; break; }

      }

    }

  }

  activeCompany = comp;

  activeType = 'all';

  activeSource = 'all';

  // 鏇存柊鎵€鏈夋寜閽姸鎬?

  document.querySelectorAll('#companyFilter .filter-btn').forEach(b => b.classList.remove('active'));

  document.querySelectorAll('#sourceFilter .filter-btn').forEach(b => b.classList.remove('active'));

  document.querySelectorAll('#typeFilter .filter-btn').forEach(b => b.classList.remove('active'));

  // 鎵惧埌瀵瑰簲鍏徃鎸夐挳

  const btns = document.querySelectorAll('#companyFilter .filter-btn');

  const idx = DATA.companies.indexOf(comp);

  if (idx >= 0 && btns[idx + 1]) btns[idx + 1].classList.add('active');

  document.querySelector('#sourceFilter .filter-btn:first-child').classList.add('active');

  document.querySelector('#typeFilter .filter-btn:first-child').classList.add('active');

  render();

  // 婊氬姩鍒版柊闂诲垪琛?

  document.querySelector('.card-grid')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

}



function getFiltered() {

  const kw = document.getElementById('searchBox').value.toLowerCase().trim();

  return DATA.news.filter(n => {

    if (activeCompany !== 'all' && n.company !== activeCompany) return false;

    if (activeSource !== 'all' && n.source !== activeSource) return false;

    if (activeType !== 'all' && n.type !== activeType) return false;

    if (kw) {

      // 鎼滅储锛氭爣棰?+ 鎽樿 + 鏃ユ湡 + 鍏徃鍚?

      var inTitle = n.title.toLowerCase().includes(kw);

      var inSummary = n.summary.toLowerCase().includes(kw);

      var inDate = n.date.includes(kw);

      var inCompany = n.company.toLowerCase().includes(kw);

      // 澶勭悊鏃ユ湡绠€鍐欙細2026-5-3 鈫?鍖归厤 2026-05-03

      if (kw.indexOf('-') > 0 && kw.length < 12) {

        var parts = kw.split('-');

        var padded = parts.map(function(p) { return p.length === 1 ? '0' + p : p; }).join('-');

        if (!inDate) inDate = n.date.includes(padded);

      }

      if (!inTitle && !inSummary && !inDate && !inCompany) return false;

    }

    return true;

  });

}



function cc(c) {

  const m = {'Waymo':'cc-Waymo','Tesla':'cc-Tesla','Zoox':'cc-Zoox','Wayve':'cc-Wayve','Aurora':'cc-Aurora',

    'Nuro':'cc-Nuro','Motional':'cc-Motional','WeRide':'cc-WeRide','Uber':'cc-Uber','鐧惧害Apollo':'cc-鐧惧害Apollo','婊存淮鍑鸿':'cc-婊存淮鍑鸿','鏇规搷鍑鸿':'cc-鏇规搷鍑鸿','Momenta':'cc-Momenta','Lucid':'cc-Lucid','Rivian':'cc-Rivian'};

  return m[c] || '';

}



function render() {

  const items = getFiltered();

  const grid = document.getElementById('cardGrid');

  if (!items.length) { grid.innerHTML = '<div class="loading">娌℃湁绗﹀悎鏉′欢鐨勬柊闂?/div>'; }

  else {

    function cl(c) { const m = DATA.company_labels||{}; return m[c]||c; }

    function tc(t) { return 'ct-' + t.replace(/\s+/g,''); }

    grid.innerHTML = items.map(n => `

      <div class="card" onclick="window.open('${n.url}','_blank')">

        <div class="card-top">

          <span class="card-date">${n.date}</span>

          <span style="display:flex;gap:4px;align-items:center;">

            <span class="card-type ${tc(n.type)}">${n.type}</span>

            <span class="card-company ${cc(n.company)}">${cl(n.company)}</span>

          </span>

        </div>

        <div class="card-title">${n.title}</div>

        <div class="card-summary">${n.summary}</div>

        <div class="card-bottom">

          <span class="card-source">${n.source}</span>

          <a class="card-link" href="${n.url}" target="_blank">鏌ョ湅鍘熸枃 鈫?/a>

        </div>

      </div>

    `).join('');

  }



  const tl = document.getElementById('timelineContent');

  if (!items.length) { tl.innerHTML = '<div class="loading">娌℃湁绗﹀悎鏉′欢鐨勬柊闂?/div>'; }

  else {

    let lastDate = '';

    tl.innerHTML = items.map(function(n) {

      var h = n.date !== lastDate ? '<div class="tl-date-header">' + n.date + '</div>' : '';

      lastDate = n.date;

      return h + '<div class="tl-item" data-url="' + n.url.replace(/"/g,'&quot;') + '"><div class="tl-card">' +

        '<div class="tl-title">' + n.title + '</div>' +

        '<div class="tl-meta">' + n.company + ' 路 ' + n.source + '</div>' +

        '<div class="tl-summary">' + n.summary + '</div></div></div>';

    }).join('');

    // 鏃堕棿绾跨偣鍑昏烦杞?

    tl.onclick = function(e) {

      var item = e.target.closest('.tl-item');

      if (!item) return;

      var url = item.getAttribute('data-url');

      if (url) window.open(url, '_blank');

    };

  }

}



function switchView(v, btn) {

  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));

  btn.classList.add('active');

  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

  document.getElementById('view-' + v).classList.add('active');

}



function renderWeekly() {

  const r = DATA.weekly_report;

  const block = document.getElementById('weeklyBlock');

  if (!r || !r.summary) {

    document.getElementById('weeklyHL').innerHTML = '<div class="hl-item">鏈懆鏆傛棤鏂板鏂伴椈</div>';

    return;

  }



  // 鏄剧ず鏃ユ湡鑼冨洿: 2026-05-04~2026-05-10 -> 2026-5-4~2026-5-10

  var dr = (r.date_range || '');

  dr = dr.split('~').map(function(s) {

    var p = s.split('-');

    return p[0] + '-' + parseInt(p[1]) + '-' + parseInt(p[2]);

  }).join('~');

  document.getElementById('weekBadge').textContent = dr;



  // Highlights - extract company from parentheses at end: "鍐呭锛堝叕鍙稿悕锛?

  function extractCompany(hl) {

    // 鍖归厤鍏ㄨ锛堬級鍜屽崐瑙?)锛屽彇鏈€鍚庝竴缁?

    var m = hl.match(/[锛?]([^锛?]+)[锛?]\s*$/);

    return m ? m[1].trim() : null;

  }

  function getMatchingNews(company, limit=3) {

    if (!company) return [];

    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);

    const ws = weekAgo.toISOString().slice(0,10);

    return DATA.news.filter(n => n.company === company && n.date >= ws).slice(0, limit);

  }

  document.getElementById('weeklyHL').innerHTML =

    (r.highlights||[]).map(function(h) {

      var comp = extractCompany(h);

      // 涓枃鍚嶁啋鏁版嵁搴撹嫳鏂囧悕鏄犲皠

      if (comp && DATA.company_labels) {

        for (var k in DATA.company_labels) {

          if (DATA.company_labels[k] === comp) { comp = k; break; }

        }

      }

      var news = getMatchingNews(comp);

      // 鏋勫缓寮瑰嚭鍗＄墖HTML锛岀敤data灞炴€?

      var popupItems = news.map(function(n) {

        var label = (DATA.company_labels||{})[n.company] || n.company;

        return '<div class="popup-item" data-url="' + n.url.replace(/"/g,'&quot;') + '">' +

          '<div class="pi-date">' + n.date + '</div>' +

          '<div class="pi-title">' + n.title.slice(0, 80) + '</div>' +

          '<div class="pi-source">' + label + ' 路 ' + n.source + '</div></div>';

      }).join('');

      var popup = '<div class="hl-popup" data-comp="' + (comp||'') + '">' +

        '<div class="popup-title">鏈懆 ' + ((DATA.company_labels||{})[comp]||comp) + ' 鍔ㄦ€?/div>' +

        (news.length ? popupItems : '<div class="popup-item" style="color:#a0aec0;font-size:12px;padding:8px 0;">鏆傛棤鏈懆鐩稿叧鏂伴椈</div>') + '</div>';

      return '<div class="hl-item" data-company="' + (comp||'') + '">' +

        '<span class="hl-icon">馃搶</span>' + h + popup + '</div>';

    }).join('');



  // 鍛ㄦ姤鍐呭 鈥?缁撴瀯鍖栫患杩?

  _currentReport = r;

  var body = (r.summary || '');

  // 鍘绘帀markdown鍔犵矖鍜屾爣棰樻爣璁?

  body = body.replace(/\*\*/g, '').replace(/^#{1,3}\s*/gm, '');

  

  // 鍏徃鍚嶆彁浜垪琛?
  // 鍏徃鍚嶏紙鎸夐暱搴︽帓搴忥紝闀垮悕浼樺厛鍖归厤锛?
  var companies = ['鐧惧害Apollo','灏忛┈鏅鸿','鏂囪繙鐭ヨ','婊存淮鍑鸿','鏇规搷鍑鸿','Bot Auto','Waymo','Zoox','Tesla','Wayve','Aurora','Nuro','Motional','WeRide','Uber','婊存淮','鐗规柉鎷?,'Rivian','Lucid','Pony.ai','Nvidia'];
  
  // 鎵惧嚭绗竴涓尮閰嶇殑鍏徃鍚嶏紝姣忚鍙珮浜竴娆?
  // 楂樹寒娈佃惤涓墍鏈夊叕鍙稿悕锛堥暱鍚嶄紭鍏堝尮閰嶏紝閬垮厤"婊存淮"鎶㈠湪"婊存淮鍑鸿"鍓嶉潰锛?
  function highlightAll(text, names) {
    // 鎸夐暱搴﹂檷搴忔帓鍒楋紝闀垮悕浼樺厛鍖归厤
    var sorted = names.slice().sort(function(a,b) { return b.length - a.length; });
    var result = text;
    for (var k = 0; k < sorted.length; k++) {
      var esc = sorted[k].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp(esc, 'g');
      result = result.replace(re, '<span class="company-mention">' + sorted[k] + '</span>');
    }
    return result;
  }
  
  // 缁撴瀯鍖栫患杩帮細甯︹€㈢殑鍒嗗紑琛岋紝涓嶅甫鈥㈢殑鍚堟钀?
  body = body.replace(/銆?.+?)銆?g, '<div class="sec-title">銆?1銆?/div>');
  // 鍘婚櫎<br>绌鸿锛岄伩鍏嶇敓鎴愬浣欓棿璺?
  body = body.replace(/<br\s*\/?>\s*/g, '');
  var lines = body.split('\n');
  var htmlLines = [];
  var para = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line === '') {
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      continue;
    }
    if (line.indexOf('<div class="sec-title"') === 0) {
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      htmlLines.push(line);
      continue;
    }
    if (line.indexOf('鈥?) === 0 || line.indexOf('- ') === 0) {
      // 甯︹€㈢殑琛屽崟鐙覆鏌擄紝鍚堟钀芥椂鍏徃鍚嶉珮浜細閿欎綅
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      htmlLines.push('<div class="sec-line">' + highlightAll(line, companies) + '</div>');
    } else {
      para.push(line);
    }
  }
  if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); }
  document.getElementById('weeklyBody').innerHTML = htmlLines.join('\n');

  // Meta

  document.getElementById('weeklyFooter').innerHTML =

    '<div class="fc-count">' + (r.count || 0) + ' 鏉℃柊闂?/div>' +

    '<div class="disclaimer">鍏嶈矗澹版槑锛氭湰璧勬枡鐢卞崕娉拌瘉鍒哥爺绌舵墍浜掕仈缃戝洟闃熷埗浣滐紙鍗庢嘲璇佸埜鑲′唤鏈夐檺鍏徃宸插叿澶囦腑鍥借瘉鐩戜細鎵瑰噯鐨勮瘉鍒告姇璧勫挩璇笟鍔¤祫鏍硷級銆傛湰璧勬枡浠呬緵鏈叕鍙稿強鍏跺鎴峰拰鍏跺叧鑱旀満鏋勪娇鐢ㄣ€傛湰鍏徃涓嶅洜鎺ユ敹浜烘敹鍒版湰璧勬枡鑰岃鍏朵负瀹㈡埛銆傛湰璧勬枡鍩轰簬鏈叕鍙歌涓哄彲闈犵殑銆佸凡鍏紑鐨勪俊鎭紪鍒讹紝浣嗘湰鍏徃鍙婂叾鍏宠仈鏈烘瀯瀵硅绛変俊鎭殑鍑嗙‘鎬у強瀹屾暣鎬т笉浣滀换浣曚繚璇侊紝鎶曡祫鑰呭簲渚濊禆鑷韩鐙珛鐨勫垽鏂仛鍑烘姇璧勫喅绛栧苟鑷鎵挎媴鎶曡祫椋庨櫓銆?/div>';



  // ===== Charts =====

  var parts = (r.date_range || '').split('~');

  if (parts.length === 2) {

    drawTrendChart(parts[0], parts[1]);

    drawCompanyChart(parts[0], parts[1]);

    drawTypeChart(parts[0], parts[1]);

  } else {

    drawTrendChart();

    drawCompanyChart();

    drawTypeChart();

  }

}

function initWeekSelector() {

  var sel = document.getElementById('weekSelect');

  var history = DATA.weekly_history || [];

  // 娓呯┖锛堜繚鐣欑涓€涓彁绀洪」锛?

  sel.innerHTML = '<option value="">鍒囨崲鍘嗗彶鍛ㄦ姤...</option>';

  for (var i = 0; i < history.length; i++) {

    var h = history[i];

    var dr = h.date_range || ('绗? + (i+1) + '鍛?);

    var label = dr.replace(/-0/g, '-');

    var opt = document.createElement('option');

    opt.value = i;

    opt.textContent = label + ' (' + (h.count||0) + '鏉?';

    if (i === 0) opt.selected = true;

    sel.appendChild(opt);

  }

}



function switchWeek(idx) {

  if (idx === '') return;

  var history = DATA.weekly_history || [];

  var r = history[parseInt(idx)];

  if (!r) { console.warn('switchWeek: no report for idx', idx); return; }

  renderWeek(r);

}



function renderWeek(r) {

  // 鏀规爣棰樻棩鏈?

  var dr = (r.date_range || '').split('~').map(function(s) {

    var p = s.split('-');

    return parseInt(p[0]) + '-' + parseInt(p[1]) + '-' + parseInt(p[2]);

  }).join('~');

  document.getElementById('weekBadge').textContent = dr;

  

  // 鍏徃鍚嶆槧灏勶紙涓枃鏍囩鈫掓暟鎹簱鑻辨枃鍚嶏級

  function mapCompany(comp) {

    if (!comp || !DATA.company_labels) return comp;

    for (var k in DATA.company_labels) {

      if (DATA.company_labels[k] === comp) return k;

    }

  }

  

  // 楂樹寒

  document.getElementById('weeklyHL').innerHTML =

    (r.highlights||[]).map(function(h) {

      var comp = (h.match(/[锛?]([^锛?]+)[锛?]\s*$/) || [])[1];

      if (comp) comp = mapCompany(comp);

      var news = comp ? DATA.news.filter(function(n) { return n.company === comp; }).slice(0, 3) : [];

      var tooltip = news.length ? '<div class="hl-popup" data-comp="' + comp + '">' +

        '<div class="popup-title">鐩稿叧鏂伴椈</div>' +

        news.map(function(n) { return '<div class="popup-item" data-url="' + n.url.replace(/"/g,'&quot;') + '"><div class="pi-date">' + n.date + '</div><div class="pi-title">' + n.title.slice(0,60) + '</div></div>'; }).join('') +

        '</div>' : '';

      return '<div class="hl-item" data-company="' + (comp||'') + '"><span class="hl-icon">馃搶</span>' + h + tooltip + '</div>';

    }).join('');

  

  // 姝ｆ枃

  _currentReport = r;

  var body = (r.summary || '').replace(/\*\*/g, '');

  // 鍏徃鍚嶏紙鎸夐暱搴︽帓搴忥紝闀垮悕浼樺厛鍖归厤锛?
  var companies = ['鐧惧害Apollo','灏忛┈鏅鸿','鏂囪繙鐭ヨ','婊存淮鍑鸿','鏇规搷鍑鸿','Bot Auto','Waymo','Zoox','Tesla','Wayve','Aurora','Nuro','Motional','WeRide','Uber','婊存淮','鐗规柉鎷?,'Rivian','Lucid','Pony.ai','Nvidia'];

  // 鎵惧嚭绗竴涓尮閰嶇殑鍏徃鍚嶏紝姣忚鍙珮浜竴娆?
  // 楂樹寒娈佃惤涓墍鏈夊叕鍙稿悕
  function highlightAll(text, names) {
    var sorted = names.slice().sort(function(a,b) { return b.length - a.length; });
    var result = text;
    for (var k = 0; k < sorted.length; k++) {
      var esc = sorted[k].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp(esc, 'g');
      result = result.replace(re, '<span class="company-mention">' + sorted[k] + '</span>');
    }
    return result;
  }

  // 姝ｆ枃锛氬甫鈥㈢殑鍒嗗紑琛岋紝涓嶅甫鈥㈢殑鍚堟钀?
  body = body.replace(/銆?.+?)銆?g, '<div class="sec-title">銆?1銆?/div>');
  // 鍘婚櫎<br>绌鸿锛岄伩鍏嶇敓鎴愬浣欓棿璺?
  body = body.replace(/<br\s*\/?>\s*/g, '');
  var lines = body.split('\n');
  var htmlLines = [];
  var para = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line === '') {
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      continue;
    }
    if (line.indexOf('<div class="sec-title"') === 0) {
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      htmlLines.push(line);
      continue;
    }
    if (line.indexOf('鈥?) === 0 || line.indexOf('- ') === 0) {
      if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); para = []; }
      htmlLines.push('<div class="sec-line">' + highlightAll(line, companies) + '</div>');
    } else {
      para.push(line);
    }
  }
  if (para.length) { htmlLines.push('<div class="sec-para">' + highlightAll(para.join(' '), companies) + '</div>'); }
  document.getElementById('weeklyBody').innerHTML = htmlLines.join('\n');

  

  document.getElementById('weeklyFooter').innerHTML =

    '<div class="fc-count">' + (r.count || 0) + ' 鏉℃柊闂?/div>' +

    '<div class="disclaimer">鍏嶈矗澹版槑锛氭湰璧勬枡鐢卞崕娉拌瘉鍒哥爺绌舵墍浜掕仈缃戝洟闃熷埗浣滐紙鍗庢嘲璇佸埜鑲′唤鏈夐檺鍏徃宸插叿澶囦腑鍥借瘉鐩戜細鎵瑰噯鐨勮瘉鍒告姇璧勫挩璇笟鍔¤祫鏍硷級銆傛湰璧勬枡浠呬緵鏈叕鍙稿強鍏跺鎴峰拰鍏跺叧鑱旀満鏋勪娇鐢ㄣ€傛湰鍏徃涓嶅洜鎺ユ敹浜烘敹鍒版湰璧勬枡鑰岃鍏朵负瀹㈡埛銆傛湰璧勬枡鍩轰簬鏈叕鍙歌涓哄彲闈犵殑銆佸凡鍏紑鐨勪俊鎭紪鍒讹紝浣嗘湰鍏徃鍙婂叾鍏宠仈鏈烘瀯瀵硅绛変俊鎭殑鍑嗙‘鎬у強瀹屾暣鎬т笉浣滀换浣曚繚璇侊紝鎶曡祫鑰呭簲渚濊禆鑷韩鐙珛鐨勫垽鏂仛鍑烘姇璧勫喅绛栧苟鑷鎵挎媴鎶曡祫椋庨櫓銆?/div>';

  

  // 鏇存柊鍥捐〃涓哄巻鍙插懆鏁版嵁

  var parts = (r.date_range || '').split('~');

  if (parts.length === 2) {

    drawTrendChart(parts[0], parts[1]);

    drawCompanyChart(parts[0], parts[1]);

    drawTypeChart(parts[0], parts[1]);

  }

}



// 鍏ㄥ眬鍥捐〃瀹炰緥锛岀敤浜庡垏鎹㈠懆鎶ユ椂閿€姣?

var _chartTrend = null, _chartCompanies = null, _chartTypes = null;



function destroyCharts() {

  if (_chartTrend) { _chartTrend.destroy(); _chartTrend = null; }

  if (_chartCompanies) { _chartCompanies.destroy(); _chartCompanies = null; }

  if (_chartTypes) { _chartTypes.destroy(); _chartTypes = null; }

}



function drawTrendChart(fromDate, toDate) {

  destroyCharts();

  

  var days = [], counts = [];

  if (fromDate && toDate) {

    // 鍘嗗彶鍛細鏄剧ず璇ュ懆姣忓ぉ鐨勫垎甯?

    var start = new Date(fromDate);

    var end = new Date(toDate);

    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {

      var ds = d.toISOString().slice(0,10);

      days.push((d.getMonth()+1)+'/'+d.getDate());

      counts.push(DATA.news.filter(function(n) { return n.date === ds; }).length);

    }

  } else {

    // 榛樿锛氭渶杩?4澶?

    var weekAgo = new Date();

    weekAgo.setDate(weekAgo.getDate() - 13);

    for (var i = 0; i < 14; i++) {

      var d = new Date(weekAgo);

      d.setDate(d.getDate() + i);

      var ds = d.toISOString().slice(0,10);

      days.push((i % 2 === 0) ? (d.getMonth()+1)+'/'+d.getDate() : '');

      counts.push(DATA.news.filter(function(n) { return n.date === ds; }).length);

    }

  }



  _chartTrend = new Chart(document.getElementById('chartTrend'), {

    type: 'line',

    data: {

      labels: days,

      datasets: [{

        label: '鏂伴椈鏁?,

        data: counts,

        borderColor: '#667eea',

        backgroundColor: 'rgba(102,126,234,0.08)',

        fill: true,

        tension: 0.4,

        pointRadius: 3,

        pointBackgroundColor: '#667eea',

        borderWidth: 2,

      }]

    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: { display: false },

        tooltip: {

          backgroundColor: '#1a1a2e',

          titleFont: { size: 11 },

          bodyFont: { size: 12 },

          padding: 8,

          callbacks: {

            label: function(ctx) { return ctx.parsed.y + ' 鏉℃柊闂?; }

          }

        }

      },

      scales: {

        x: { ticks: { font: { size: 10 }, color: '#a0aec0' }, grid: { display: false } },

        y: { ticks: { font: { size: 10 }, color: '#a0aec0', stepSize: 1 }, grid: { color: '#f0f2f5' } }

      },

      hover: { mode: 'index', intersect: false }

    }

  });

}



function drawTypeChart(fromDate, toDate) {

  var weekNews;

  if (fromDate && toDate) {

    weekNews = DATA.news.filter(function(n) { return n.date >= fromDate && n.date <= toDate; });

  } else {

    var weekAgo = new Date();

    weekAgo.setDate(weekAgo.getDate() - 7);

    weekNews = DATA.news.filter(function(n) { return n.date >= weekAgo.toISOString().slice(0,10); });

  }

  

  var byType = {};

  weekNews.forEach(function(n) {

    byType[n.type] = (byType[n.type] || 0) + 1;

  });

  

  var sorted = Object.entries(byType).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 7);

  var typeColors = {

    '鎶€鏈獊鐮?:'#667eea','鍟嗕笟鎷撳睍':'#38a169','琛屼笟鍔ㄦ€?:'#d69e2e',

    '鍚堜綔':'#319795','铻嶈祫鎶曡祫':'#805ad5','瀹夊叏涓庣洃绠?:'#e53e3e',

    '璐㈡姤':'#e07c3e','鍏朵粬':'#a0aec0'

  };



  _chartTypes = new Chart(document.getElementById('chartTypeDist'), {

    type: 'doughnut',

    data: {

      labels: sorted.map(function(s) { return s[0] + ' ' + s[1]; }),

      datasets: [{

        data: sorted.map(function(s) { return s[1]; }),

        backgroundColor: sorted.map(function(s) { return (typeColors[s[0]]||'#a0aec0') + '99'; }),

        borderColor: sorted.map(function(s) { return typeColors[s[0]]||'#a0aec0'; }),

        borderWidth: 1,

      }]

    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {

          position: 'right',

          labels: { font: { size: 10 }, color: '#4a5568', padding: 8 }

        },

        tooltip: {

          callbacks: {

            label: function(ctx) { return ctx.parsed + ' 鏉?; }

          }

        }

      }

    }

  });

}



function drawCompanyChart(fromDate, toDate) {

  var weekNews;

  if (fromDate && toDate) {

    weekNews = DATA.news.filter(function(n) { return n.date >= fromDate && n.date <= toDate && n.company !== 'Sawyer Merritt'; });

  } else {

    var weekAgo = new Date();

    weekAgo.setDate(weekAgo.getDate() - 7);

    weekNews = DATA.news.filter(function(n) { return n.date >= weekAgo.toISOString().slice(0,10) && n.company !== 'Sawyer Merritt'; });

  }

  

  var byCompany = {};

  weekNews.forEach(function(n) {

    byCompany[n.company] = (byCompany[n.company] || 0) + 1;

  });

  

  var sorted = Object.entries(byCompany).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 8);

  var colors = ['#667eea','#e53e3e','#805ad5','#38a169','#d69e2e','#319795','#e07c3e','#5277e6'];



  _chartCompanies = new Chart(document.getElementById('chartCompanies'), {

      labels: sorted.map(function(s) { return s[0]; }),

      datasets: [{

        label: '鏂伴椈鏁?,

        data: sorted.map(function(s) { return s[1]; }),

        backgroundColor: sorted.map(function(_, i) { return colors[i % colors.length] + '33'; }),

        borderColor: sorted.map(function(_, i) { return colors[i % colors.length]; }),

        borderWidth: 1,

        borderRadius: 3,

      }]

    },

    options: {

      indexAxis: 'y',

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: { display: false },

        tooltip: {

          backgroundColor: '#1a1a2e',

          titleFont: { size: 11 },

          bodyFont: { size: 12 },

          padding: 8,

          callbacks: {

            label: function(ctx) {

              var c = ctx.label;

              var info = (DATA.company_info || {})[c] || '';

              var label = (DATA.company_labels || {})[c] || c;

              return label + ' ' + ctx.parsed.x + '鏉?;

            },

            afterLabel: function(ctx) {

              var info = (DATA.company_info || {})[ctx.label] || '';

              return info ? '鈥斺€? + info : '';

            }

          }

        }

      },

      scales: {

        x: { ticks: { font: { size: 10 }, color: '#a0aec0', stepSize: 1 }, grid: { color: '#f0f2f5' } },

        y: { ticks: { font: { size: 10 }, color: '#4a5568' }, grid: { display: false } }

      }

    }

  });

}



// ===== 涓嬭浇鍛ㄦ姤 =====

function downloadReport() {

  var r = _currentReport;

  if (!r) { alert('娌℃湁鍙笅杞界殑鍛ㄦ姤'); return; }

  var dr = r.date_range || '';

  var label = dr.replace(/-0/g, '-').replace(/~/g, '鑷?);

  try {

    if (typeof html2canvas !== 'undefined') {

      var el = document.querySelector('.weekly');

      if (el) {

        var sel = document.getElementById('weekSelect');

        var dlWrap = document.querySelector('.dl-wrap');

        if (sel) sel.style.display = 'none';

        if (dlWrap) dlWrap.style.display = 'none';

        // 璁?050px閫備腑绔栫増瀹斤紝瀵煎嚭姣斾緥鎺ヨ繎A4

        el.style.width = '1050px';

        el.style.margin = '0 auto';

        addExportTitle(el);

        if (_chartTrend) _chartTrend.resize();

        if (_chartCompanies) _chartCompanies.resize();

        if (_chartTypes) _chartTypes.resize();

        requestAnimationFrame(function() {

          requestAnimationFrame(function() {

            html2canvas(el, {

              scale: 2,

              backgroundColor: '#ffffff',

              useCORS: true,

            }).then(function(c) {

              el.style.width = '';

              removeExportTitle(el);

              if (sel) sel.style.display = '';

              if (dlWrap) dlWrap.style.display = '';

              c.toBlob(function(b) {

                var a = document.createElement('a');

                a.href = URL.createObjectURL(b);

                a.download = 'robotaxi_鍛ㄦ姤_' + label + '.png';

                a.click();

                URL.revokeObjectURL(a.href);

              });

            }).catch(function() {

              el.style.width = '';

              removeExportTitle(el);

              if (sel) sel.style.display = '';

              if (dlWrap) dlWrap.style.display = '';

              downloadText(r, label);

            });

          });

        });

        return;

      }

    }

  } catch(e) {}

  downloadText(r, label);

}



function downloadText(r, label) {

  var text = 'Robotaxi 琛屼笟鍛ㄦ姤\r\n' + label + '\r\n';

  text += '='.repeat(40) + '\r\n\r\n';

  if (r.highlights && r.highlights.length) {

    text += '鏈懆瑕佺偣锛歕r\n';

    r.highlights.forEach(function(h) { text += '  ' + h + '\r\n'; });

    text += '\r\n';

  }

  text += (r.summary || '').replace(/\*\*/g, '') + '\r\n\r\n';

  text += '鍏?' + (r.count || 0) + ' 鏉℃柊闂籠r\n';

  text += '鐢熸垚鏃堕棿: ' + (DATA.updated_at || '');

  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });

  var a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download = 'robotaxi_鍛ㄦ姤_' + label + '.txt';

  a.click();

  URL.revokeObjectURL(a.href);

}

// ===== 瀵煎嚭PDF =====

function exportPDF() {

  var r = _currentReport;

  if (!r) { alert('娌℃湁鍙鍑虹殑鍛ㄦ姤'); return; }

  var dr = r.date_range || '';

  var label = dr.replace(/-0/g, '-').replace(/~/g, '鑷?);

  var el = document.querySelector('.weekly');

  if (!el) return;

  

  var sel = document.getElementById('weekSelect');

  var dlWrap = document.querySelector('.dl-wrap');

  if (sel) sel.style.display = 'none';

  if (dlWrap) dlWrap.style.display = 'none';

  el.style.width = '1050px';

  el.style.margin = '0 auto';

  addExportTitle(el);

  if (_chartTrend) _chartTrend.resize();

  if (_chartCompanies) _chartCompanies.resize();

  if (_chartTypes) _chartTypes.resize();

  try {

    requestAnimationFrame(function() {

      requestAnimationFrame(function() {

        html2canvas(el, {

          scale: 2, backgroundColor: '#ffffff', useCORS: true

        }).then(function(canvas) {

          el.style.width = '';

          removeExportTitle(el);

          if (sel) sel.style.display = '';

          if (dlWrap) dlWrap.style.display = '';

          if (typeof jspdf === 'undefined') {

            canvas.toBlob(function(b) {

              var a = document.createElement('a');

              a.href = URL.createObjectURL(b);

              a.download = 'robotaxi_鍛ㄦ姤_' + label + '.png';

              a.click();

              URL.revokeObjectURL(a.href);

            });

            return;

          }

          var imgData = canvas.toDataURL('image/png');

          var pdf = new jspdf.jsPDF('p', 'mm', 'a4');

          var pw = 190;

          var ph = (canvas.height / canvas.width) * pw;

          // 濡傛灉瓒呭嚭涓€椤碉紝鎸夐珮搴︾缉鏀?

          var maxPh = 277;

          if (ph > maxPh) { ph = maxPh; pw = (canvas.width / canvas.height) * ph; }

          pdf.addImage(imgData, 'PNG', 10, 10, pw, ph);

          pdf.save('robotaxi_鍛ㄦ姤_' + label + '.pdf');

        });

      });

    });

  } catch(e) {

    el.style.width = '';

    removeExportTitle(el);

    if (sel) sel.style.display = '';

    if (dlWrap) dlWrap.style.display = '';

    alert('PDF鐢熸垚澶辫触');

  }

}
